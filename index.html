const palette=['#d998dc','#eb5a68','#d7bded','#f4b58e','#b39ddb','#a8c4eb','#c4d8c8'];

function oval(c,x,y,a,b,color,angle=0){
 c.beginPath();
 c.ellipse(x,y,a,b,angle,0,Math.PI*2);
 c.fillStyle=color;
 c.fill();
}

function cell(c,id,x,y,r,angle=0){
 c.save();
 c.translate(x,y);
 c.rotate(angle);
 if(id===0){
  for(const [a,b] of [[-.35,-.25],[.3,.1],[-.2,.45]]){
   oval(c,a*r,b*r,r*.36,r*.23,palette[id],a);
   oval(c,a*r,b*r,r*.15,r*.11,'#934d9b');
  }
 }else if(id===1){
  oval(c,0,0,r,r*.70,'#a82f50');
  oval(c,0,-.09*r,r*.94,r*.63,'#fb777a');
  oval(c,0,-.07*r,r*.56,r*.31,'#bf3e58');
  oval(c,0,.02*r,r*.37,r*.14,'#da5666');
 }else{
  oval(c,0,0,r,r*.97,palette[id]);
  if(id===6){
   oval(c,0,0,r*.58,r*.66,'#644979');
   oval(c,r*.4,-r*.1,r*.38,r*.32,palette[id]);
  }else if(id===5){
   oval(c,-r*.08,-r*.06,r*.78,r*.75,'#45386e');
   oval(c,-r*.22,-r*.2,r*.32,r*.26,'#594a87');
  }else{
   const n=id===2?3:2;
   const pts=[];
   for(let j=0;j<n;j++){
    const a=j*2*Math.PI/n-(id===2?Math.PI/6:0);
    pts.push([r*.36*Math.cos(a),r*.34*Math.sin(a)]);
   }
   if(id===2){
    c.strokeStyle='#4e2854';
    c.lineWidth=Math.max(1.4,r*.08);
    c.beginPath();
    c.moveTo(pts[0][0],pts[0][1]);
    c.lineTo(pts[1][0],pts[1][1]);
    c.lineTo(pts[2][0],pts[2][1]);
    c.closePath();
    c.stroke();
   }
   for(const [px,py] of pts){
    oval(c,px,py,r*.33,r*.35,id===4?'#523b78':'#633967');
   }
   const gCount=id===4?64:id===3?38:14;
   for(let j=0;j<gCount;j++){
    const a=j*2.4;
    const d=r*.86*Math.sqrt((j+.4)/gCount);
    const gRadius=id===4?r*.082:id===3?r*.07:r*.05;
    const gColor=id===3?'#c94a38':id===4?(j%2?'#23143d':'#38215c'):'#8b659c';
    oval(c,d*Math.cos(a),d*Math.sin(a),gRadius,gRadius*.92,gColor);
   }
  }
 }
 c.restore();
}

function sfx(type){
 if(!soundOn||minimal)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if(type==='select'){
   osc.type='sine';
   osc.frequency.setValueAtTime(520,now);
   osc.frequency.exponentialRampToValueAtTime(660,now+0.06);
   gain.gain.setValueAtTime(0.04,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.07);
   osc.start(now);osc.stop(now+0.07);
  }else if(type==='dispatch'){
   osc.type='triangle';
   osc.frequency.setValueAtTime(300,now);
   osc.frequency.exponentialRampToValueAtTime(540,now+0.18);
   gain.gain.setValueAtTime(0.05,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.19);
   osc.start(now);osc.stop(now+0.19);
  }else if(type==='win'){
   osc.type='triangle';
   osc.frequency.setValueAtTime(523.25,now);
   osc.frequency.setValueAtTime(659.25,now+0.08);
   osc.frequency.setValueAtTime(783.99,now+0.16);
   gain.gain.setValueAtTime(0.06,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.32);
   osc.start(now);osc.stop(now+0.32);
  }else if(type==='loss'){
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(240,now);
   osc.frequency.linearRampToValueAtTime(175,now+0.22);
   gain.gain.setValueAtTime(0.04,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.24);
   osc.start(now);osc.stop(now+0.24);
  }else if(type==='gold'){
   osc.type='triangle';
   osc.frequency.setValueAtTime(523.25,now);
   osc.frequency.setValueAtTime(659.25,now+0.09);
   osc.frequency.setValueAtTime(783.99,now+0.18);
   osc.frequency.setValueAtTime(1046.5,now+0.27);
   gain.gain.setValueAtTime(0.07,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.55);
   osc.start(now);osc.stop(now+0.55);
  }else if(type==='silver'||type==='bronze'){
   osc.type='triangle';
   osc.frequency.setValueAtTime(440,now);
   osc.frequency.setValueAtTime(554.37,now+0.1);
   osc.frequency.setValueAtTime(659.25,now+0.2);
   gain.gain.setValueAtTime(0.06,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.42);
   osc.start(now);osc.stop(now+0.42);
  }else if(type==='warn'){
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(310,now);
   osc.frequency.setValueAtTime(250,now+0.14);
   gain.gain.setValueAtTime(0.05,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.34);
   osc.start(now);osc.stop(now+0.34);
  }else if(type==='fired'){
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(293.66,now);
   osc.frequency.setValueAtTime(277.18,now+0.14);
   osc.frequency.setValueAtTime(261.63,now+0.28);
   osc.frequency.linearRampToValueAtTime(185,now+0.55);
   gain.gain.setValueAtTime(0.06,now);
   gain.gain.exponentialRampToValueAtTime(0.001,now+0.58);
   osc.start(now);osc.stop(now+0.58);
  }
 }catch(e){}
}

function drawVirion(c,x,y,angle,boundEffect=0){
 c.save();
 c.translate(x,y);
 c.rotate(angle);
 const spikes=10;
 c.strokeStyle='#9ec5f8';
 c.lineWidth=1.4;
 for(let k=0;k<spikes;k++){
  const a=k*Math.PI*2/spikes;
  const x1=Math.cos(a)*6.5,y1=Math.sin(a)*6.5;
  const x2=Math.cos(a)*11,y2=Math.sin(a)*11;
  c.beginPath();
  c.moveTo(x1,y1);
  c.lineTo(x2,y2);
  c.stroke();
  oval(c,x2,y2,2.1,1.6,'#d2e6ff',a);
 }
 c.fillStyle=boundEffect>0.4?'#5f789e':'#6d9ae0';
 c.strokeStyle='#d6e8ff';
 c.lineWidth=1.2;
 c.beginPath();
 for(let k=0;k<6;k++){
  const a=k*Math.PI/3;
  const vx=Math.cos(a)*7.2,vy=Math.sin(a)*7.2;
  if(k===0)c.moveTo(vx,vy);else c.lineTo(vx,vy);
 }
 c.closePath();
 c.fill();
 c.stroke();
 c.strokeStyle='#39588a88';
 c.lineWidth=0.9;
 c.beginPath();
 c.moveTo(-7,0);c.lineTo(7,0);
 c.moveTo(-3.5,-6);c.lineTo(3.5,6);
 c.moveTo(3.5,-6);c.lineTo(-3.5,6);
 c.stroke();
 if(boundEffect>0.15){
  c.save();
  c.globalAlpha=Math.min(1,(boundEffect-0.15)/0.5);
  c.strokeStyle='#ffe18a';
  c.lineWidth=2.1;
  c.lineCap='round';
  for(const dir of [-0.75,2.2]){
   c.save();
   c.rotate(dir);
   c.beginPath();
   c.moveTo(11,0);
   c.lineTo(15,-3.5);
   c.moveTo(11,0);
   c.lineTo(15,3.5);
   c.moveTo(15,0);
   c.lineTo(21,0);
   c.stroke();
   c.restore();
  }
  c.restore();
 }
 c.restore();
}

 function draw(now){
  const t=minimal?3:(now-start)/1000;
  const arrival=unit===null?0:Math.min(1,t/0.85);
  const effect=right?Math.min(1,Math.max(0,(t-.85)/.95)):0;
  const failed=unit!==null&&!right&&arrival>=0.95;

  const bg=c.createLinearGradient(0,0,0,270);
  bg.addColorStop(0,'#1d1128');
  bg.addColorStop(.52,'#5e2c46');
  bg.addColorStop(1,'#241229');
  c.fillStyle=bg;
  c.fillRect(0,0,500,270);

  c.fillStyle='#3d1c33aa';
  c.fillRect(0,0,500,14);
  if(round!==0){
   c.fillRect(0,256,500,14);
  }else{
   c.fillRect(0,256,260,14);
   c.fillRect(352,256,148,14);
  }
  for(let e=0;e<13;e++){
   oval(c,e*42+18,7,18,4,'#7a3e5c55');
   if(round!==0||e<6||e>8)oval(c,e*42+18,263,18,4,'#7a3e5c55');
  }

  for(let j=0;j<65;j++){
   const x=(j*79+t*14)%510;
   oval(c,x,18+(j*41)%234,1.5,1,'#f0cade42');
  }
  for(let j=0;j<12;j++){
   const x=(j*113+t*(11+j%5))%550-25,y=28+(j*53)%195;
   if(Math.abs(x-306)>72||Math.abs(y-125)>66)cell(c,1,x,y,10+j%7,j*.6+t*.06);
  }

  const spot=c.createRadialGradient(306,125,8,306,125,88);
  spot.addColorStop(0,effect>0.5?'#7ed6bb24':'#ff9eb518');
  spot.addColorStop(1,'#00000000');
  c.fillStyle=spot;
  c.fillRect(210,35,192,180);

  const x=306,y=125;
  c.save();
  c.translate(x,y);

  if(round===0){
   for(let j=-6;j<=6;j++){
    if(j===-1||j===0||j===1)continue;
    const ex=j*16,ey=36+Math.abs(j)*1.5;
    oval(c,ex,ey,12,6.5,'#e58f88',j*.04);
    oval(c,ex,ey,4.5,2.2,'#7c2d46',j*.04);
   }
   c.strokeStyle='#f7d4b2';
   c.lineWidth=1.5;
   for(const [cx,cy,tx,ty] of [[-28,38,-14,22],[-22,42,-8,28],[-16,45,-4,33],[28,38,14,22],[22,42,8,28],[16,45,4,33]]){
    c.beginPath();
    c.moveTo(cx,cy);
    c.quadraticCurveTo((cx+tx)/2,cy-8,tx+Math.sin(t*3+cx)*1.5,ty);
    c.stroke();
   }
   if(effect<.92){
    for(let j=0;j<5;j++){
     const leakY=34+((t*(failed?80:46)+j*18)%78);
     const leakX=Math.sin(j*2.1+t*2)*10*(1-effect);
     cell(c,1,leakX,leakY,6.2*(1-effect*0.5),j+t);
    }
   }
   if(effect>0){
    const pCount=Math.ceil(effect*11);
    for(let j=0;j<pCount;j++){
     const px=((j%4)-1.5)*10+Math.sin(j)*3;
     const py=35-Math.floor(j/4)*5;
     cell(c,0,px,py,9.5,j*0.7);
    }
    if(effect>0.35){
     c.save();
     c.globalAlpha=Math.min(1,(effect-0.35)/0.55);
     c.strokeStyle='#ffe294';
     c.lineWidth=1.6;
     for(const [x1,y1,x2,y2] of [[-26,36,26,34],[-22,28,24,39],[-18,41,20,27],[-25,31,18,31]]){
      c.beginPath();
      c.moveTo(x1,y1);
      c.quadraticCurveTo(0,y1-5,x2,y2);
      c.stroke();
     }
     c.restore();
    }
   }
  }else if(round===1){
   const bCount=failed?7:5;
   for(let j=0;j<bCount;j++){
    const itemProgress=Math.max(0,Math.min(1,effect*bCount-j));
    if(itemProgress>=1)continue;
    const a=j*2.25+t*(failed?0.55:0.28);
    const dist=(18+j*6.5)*(1-itemProgress*0.85);
    const bx=Math.cos(a)*dist+(itemProgress>0?(-25*itemProgress):0);
    const by=Math.sin(a)*(14+j*4.5)*(1-itemProgress*0.85);
    drawBacterium(c,bx,by,a+Math.PI/2,t*9+j*1.7,1-itemProgress*0.9);
   }
  }else if(round===2){
   const pulse=effect>0?Math.sin(t*7)*2.2*effect:Math.sin(t*2)*0.6;
   for(let f=-1;f<=1;f++){
    c.save();
    c.translate(10,f*27);
    c.rotate(-0.14);
    const fiberW=96+pulse*2,fiberH=16;
    const rCol=Math.round(118+effect*118);
    const gCol=Math.round(68+effect*34);
    const bCol=Math.round(92+effect*18);
    c.fillStyle=`rgb(${rCol},${gCol},${bCol})`;
    c.strokeStyle=effect>0.4?'#ff9eb0':'#8f5970';
    c.lineWidth=1.3;
    c.beginPath();
    c.roundRect(-fiberW/2,-fiberH/2,fiberW,fiberH,7);
    c.fill();
    c.stroke();
    c.strokeStyle=effect>0.4?'#ffd0d866':'#3d1c2e88';
    c.lineWidth=2.1;
    const spacing=7.5-effect*0.6;
    for(let sx=-fiberW/2+8;sx<fiberW/2-6;sx+=spacing){
     c.beginPath();
     c.moveTo(sx,-fiberH/2+1.5);
     c.lineTo(sx,fiberH/2-1.5);
     c.stroke();
    }
    oval(c,-22,-fiberH/2+2.5,5.5,2.1,'#4d2242');
    oval(c,18,fiberH/2-2.5,5.5,2.1,'#4d2242');
    c.restore();
   }
  }else if(round===3){
   const wriggleSpeed=failed?5.2:3.1;
   const amp=11.5*(1-effect*0.82);
   const pts=[];
   for(let j=-46;j<=46;j+=2){
    const dy=Math.sin(j/13+t*wriggleSpeed)*amp+Math.cos(j/25-t)*3*(1-effect*0.7);
    pts.push([j,dy]);
   }
   for(let p=0;p<pts.length;p++){
    const [wx,wy]=pts[p];
    const norm=Math.abs(wx)/46;
    const rad=Math.max(2.2,8.5*(1-norm*norm*0.78));
    const wormColor=effect>0.55?'#9b7a8e':p%3===0?'#d99b86':'#ebb59e';
    oval(c,wx,wy,rad,rad*0.88,wormColor);
   }
   c.strokeStyle=effect>0.55?'#63485a88':'#9c554899';
   c.lineWidth=2.2;
   c.beginPath();
   pts.forEach(([wx,wy],idx)=>{if(idx===0)c.moveTo(wx,wy);else c.lineTo(wx,wy)});
   c.stroke();
   if(effect>0.2){
    for(let k=0;k<10;k++){
     const idx=Math.min(pts.length-1,4+k*4);
     const [lx,ly]=pts[idx];
     oval(c,lx,ly+(k%2?3:-3),3.2*effect,2.4*effect,'#ff6042');
    }
   }
  }else if(round===4){
   if(effect>0.05){
    for(let ring=0;ring<3;ring++){
     const prog=(effect*1.3+ring*0.33)%1;
     c.strokeStyle=`rgba(255,195,121,${(1-prog)*0.65})`;
     c.lineWidth=2.2;
     c.beginPath();
     c.arc(-10,0,14+prog*64,0,Math.PI*2);
     c.stroke();
    }
   }
   for(let j=0;j<6;j++){
    const a=j*Math.PI/3+t*0.35;
    const rad=j===0?0:24+Math.sin(t*1.5+j)*3;
    const px=Math.cos(a)*rad+8;
    const py=Math.sin(a)*rad*0.85;
    drawPollenGrain(c,px,py,j===0?9.5:8,t*0.4+j);
   }
  }else if(round===5){
   const vCount=5;
   for(let j=0;j<vCount;j++){
    const a=j*2*Math.PI/vCount+t*(0.22*(1-effect*0.85));
    const rx=Math.cos(a)*(22+(j%2)*9)+10;
    const ry=Math.sin(a)*(18+(j%2)*7);
    drawVirion(c,rx,ry,t*0.5+j,effect);
   }
  }else if(round===6){
   c.strokeStyle='#6e456255';
   c.lineWidth=1.4;
   for(let m=-2;m<=2;m++){
    c.beginPath();
    c.moveTo(-45,m*16-8);
    c.quadraticCurveTo(0,m*16+10,55,m*16-4);
    c.stroke();
   }
   const dCount=7;
   for(let j=0;j<dCount;j++){
    const itemProgress=Math.max(0,Math.min(1,effect*dCount-j));
    if(itemProgress>=1)continue;
    const a=j*1.9+0.4;
    const dist=(16+(j%3)*12)*(1-itemProgress*0.88);
    const dx=Math.cos(a)*dist+8*(1-itemProgress)+(-25*itemProgress);
    const dy=Math.sin(a)*dist*0.82;
    drawDebrisShard(c,dx,dy,j,j*1.1+t*0.15,1-itemProgress*0.9);
   }
  }

  if(unit!==null){
   let dx,dy;
   if(right){
    dx=-290+265*arrival;
    dy=(round===0?26:0)-15*Math.sin(arrival*Math.PI);
   }else{
    if(arrival<0.72){
     const p=arrival/0.72;
     dx=-290+258*p;
     dy=-16*Math.sin(p*Math.PI);
    }else{
     const bounce=(arrival-0.72)/0.28;
     dx=-32-38*bounce+Math.sin(t*28)*4*(1-bounce*0.5);
     dy=18*bounce;
    }
   }

   if(right&&effect>0&&(round===1||round===6)){
    const reach=Math.sin(Math.min(1,effect*1.4)*Math.PI)*28;
    const armColor=palette[unit];
    c.fillStyle=armColor;
    c.beginPath();
    c.moveTo(dx+8,dy-12);
    c.quadraticCurveTo(dx+22+reach,dy-22,dx+18+reach,dy-4);
    c.quadraticCurveTo(dx+22+reach,dy+18,dx+8,dy+12);
    c.closePath();
    c.fill();
   }

   const unitRadius=round===6&&right?19+effect*9:20;
   if(round===6&&right&&effect>0.2){
    for(let k=0;k<8;k++){
     const ra=k*Math.PI/4+t*2;
     oval(c,dx+Math.cos(ra)*(unitRadius-2),dy+Math.sin(ra)*(unitRadius-2),7*effect,5*effect,palette[6],ra);
    }
   }
   cell(c,unit,dx,dy,unitRadius,-.19);

   if(effect>0&&[2,3,4].includes(round)){
    for(let j=0;j<18;j++){
     const f=(t*1.05+j/18)%1;
     const px=dx+14+f*(round===4?82:52);
     const py=dy+Math.sin(j*1.7+t*2)*f*38;
     oval(c,px,py,round===3?3.1:2.6,round===3?3.1:2.6,round===2?'#92ecff':round===4?'#ffc379':'#ff6e4a');
    }
   }

   if(effect>0&&round===5){
    c.strokeStyle='#ffe18a';
    c.lineWidth=1.8;
    for(let j=0;j<8;j++){
     const f=(t*0.95+j/8)%1;
     const ax=dx+16+f*52;
     const ay=dy+Math.sin(j*2.1)*f*30;
     c.beginPath();
     c.moveTo(ax-4,ay);c.lineTo(ax,ay);
     c.lineTo(ax+3,ay-3);
     c.moveTo(ax,ay);c.lineTo(ax+3,ay+3);
     c.stroke();
    }
   }

   if(failed){
    c.strokeStyle='#ff9e7d';
    c.lineWidth=1.8;
    c.setLineDash([4,4]);
    c.beginPath();
    c.arc(dx,dy,26,0,Math.PI*2);
    c.stroke();
    c.setLineDash([]);
   }
  }
  c.restore();

  c.strokeStyle=failed?'#ed9779':effect>0.8?'#88d8b5':'#a4d5c5';
  c.lineWidth=1.5;
  for(const [a,b,sx,sy] of [[228,54,1,1],[384,54,-1,1],[228,198,1,-1],[384,198,-1,-1]]){
   c.beginPath();
   c.moveTo(a+sx*14,b);c.lineTo(a,b);c.lineTo(a,b+sy*14);
   c.stroke();
  }
  if(!minimal)frame=requestAnimationFrame(draw);
 }
 draw(start);
}

function captain(canvas,mood='normal'){
 const c=canvas.getContext('2d');
 c.clearRect(0,0,canvas.width,canvas.height);
 const p=5;
 function tile(x,y,w,h,color){c.fillStyle=color;c.fillRect(x*p,y*p,w*p,h*p)}
 const rows=[
  '          gggggggg          ',
  '        ggccccccccgg        ',
  '       gccchhhhhhcccg       ',
  '       gccccyyccccccg       ',
  '      gggggggggggggggg      ',
  '        gggggggggggg        ',
  '        ddssssssssdd        ',
  mood==='warn'||mood==='fired'?'       ddwlllsslllwdd       ':'       ddslllsslllsdd       ',
  '       ddswdsllsdwsdd       ',
  '        dslllsslllsd        ',
  '         slllsstlls         ',
  mood==='fired'?'         ssltllllts         ':mood==='warn'?'         ssltttttls         ':'         sslttttlls         ',
  '          slllllls          ',
  '        ccgssllssgcc        ',
  '     ccccccgssssccecccc     ',
  '   cceeecccchhhhcccceecc    ',
  '  cccccccccchyyhccccccccc   ',
  ' cccccccccccchhccccccccccc  ',
  ' cccggccccccchhccccccggccc  '
 ];
 const colors={
  g:mood==='fired'?'#3b1219':mood==='warn'?'#3b2610':'#102b37',
  c:mood==='fired'?'#8c2d3b':mood==='warn'?'#96622b':'#37868c',
  h:'#cce7d9',
  y:'#f1c768',
  d:'#44353b',
  s:'#be8065',
  l:'#edb899',
  t:'#975e52',
  w:'#f4e9ce',
  e:'#e5b565'
 };
 rows.forEach((row,y)=>[...row].forEach((s,x)=>{if(colors[s])tile(x,y,1,1,colors[s])}));
}

function evaluateShiftTier(rawScore,total){
 if(rawScore===0){
  return {
   tier:'fired',
   badge:'0 / '+total+' · Relieved of Command',
   badgeClass:'rank-fired',
   headline:'You Are Fired from the Helm!',
   quote:'"Zero first-try dispatches?! Pack up your pipette and turn in your command badge—you are relieved of duty! Study the Crew Codex before re-applying."',
   quoteClass:'fired'
  };
 }
 const scaled=total===10?rawScore:Math.round((rawScore/total)*10);
 if(scaled>=10){
  return {
   tier:'gold',
   badge:'10 / 10 Equivalent · Gold Dispatch Medal',
   badgeClass:'rank-gold',
   headline:'Gold Medal · Chief Hematology Commander',
   quote:'"Flawless command! Every single emergency call was answered on the first dispatch. The Fleet Surgeon awards you the Gold Dispatch Medal!"',
   quoteClass:''
  };
 }
 if(scaled>=8){
  return {
   tier:'silver',
   badge:rawScore+' / '+total+' · Silver Dispatch Medal',
   badgeClass:'rank-silver',
   headline:'Silver Medal · Senior Lab Dispatcher',
   quote:'"Sharp work on the microscope! Your rapid leukocyte and platelet dispatches kept the patient stable and earned the Silver Dispatch Medal."',
   quoteClass:''
  };
 }
 if(scaled>=6){
  return {
   tier:'bronze',
   badge:rawScore+' / '+total+' · Bronze Dispatch Medal',
   badgeClass:'rank-bronze',
   headline:'Bronze Medal · Qualified Crew Dispatcher',
   quote:'"Shift passed! You contained the threats and earned the Bronze Dispatch Medal. Drill your missed calls below to reach Silver and Gold."',
   quoteClass:''
  };
 }
 return {
  tier:'warn',
  badge:rawScore+' / '+total+' · Official Command Warning',
  badgeClass:'rank-warn',
  headline:'Official Warning from the Captain',
  quote:'"Captain’s Warning! Too many wrong dispatches left damaged vessels and tissues waiting for backup. You are on shift probation—hit the Crew Codex now!"',
  quoteClass:'warn'
 };
}

function paintRewardScene(canvas,tier){
 stopScene();
 const c=canvas.getContext('2d'),start=performance.now();
 const offCapt=document.createElement('canvas');
 offCapt.width=140;offCapt.height=100;
 captain(offCapt,tier==='fired'?'fired':tier==='warn'?'warn':'normal');

 function drawStar(cx,cy,spikes,outerR,innerR,color,rot=0){
  c.save();
  c.translate(cx,cy);
  c.rotate(rot);
  c.fillStyle=color;
  c.beginPath();
  for(let i=0;i<spikes*2;i++){
   const r=i%2===0?outerR:innerR;
   const a=i*Math.PI/spikes-Math.PI/2;
   if(i===0)c.moveTo(Math.cos(a)*r,Math.sin(a)*r);
   else c.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  c.closePath();
  c.fill();
  c.restore();
 }

 function draw(now){
  const t=minimal?2:(now-start)/1000;
  c.clearRect(0,0,440,260);

  if(tier==='gold'||tier==='silver'||tier==='bronze'){
   const bg=c.createRadialGradient(220,130,15,220,130,210);
   if(tier==='gold'){
    bg.addColorStop(0,'#4f3b16');bg.addColorStop(.55,'#23333d');bg.addColorStop(1,'#111e25');
   }else if(tier==='silver'){
    bg.addColorStop(0,'#344b57');bg.addColorStop(.55,'#1e313b');bg.addColorStop(1,'#111e25');
   }else{
    bg.addColorStop(0,'#472c1e');bg.addColorStop(.55,'#232f38');bg.addColorStop(1,'#111e25');
   }
   c.fillStyle=bg;
   c.fillRect(0,0,440,260);

   // Rotating celebratory light rays
   c.save();
   c.translate(220,132);
   c.rotate(t*0.35);
   const rayCount=tier==='gold'?16:12;
   c.fillStyle=tier==='gold'?'#ffd86b1a':tier==='silver'?'#cfe8f516':'#f4a87815';
   for(let i=0;i<rayCount;i++){
    c.beginPath();
    const a=i*Math.PI*2/rayCount;
    c.moveTo(0,0);
    c.arc(0,0,210,a,a+Math.PI/rayCount*0.55);
    c.closePath();
    c.fill();
   }
   c.restore();

   // Orbiting honor-guard blood cells
   const orbitCells=tier==='gold'?7:tier==='silver'?5:3;
   for(let i=0;i<orbitCells;i++){
    const a=t*0.75+i*(Math.PI*2/orbitCells);
    const ox=220+Math.cos(a)*138;
    const oy=132+Math.sin(a)*82;
    cell(c,i%7,ox,oy,15,Math.sin(t+i)*0.25);
   }

   // Neck ribbon V-straps
   c.lineWidth=18;
   c.lineCap='butt';
   c.strokeStyle=tier==='gold'?'#b82946':tier==='silver'?'#2b6e82':'#38725b';
   c.beginPath();
   c.moveTo(165,16);c.lineTo(212,115);
   c.moveTo(275,16);c.lineTo(228,115);
   c.stroke();
   c.lineWidth=5;
   c.strokeStyle=tier==='gold'?'#ffe382':tier==='silver'?'#d9f0ff':'#f5c396';
   c.beginPath();
   c.moveTo(165,16);c.lineTo(212,115);
   c.moveTo(275,16);c.lineTo(228,115);
   c.stroke();

   // Medal clasp
   c.fillStyle=tier==='gold'?'#f5c542':tier==='silver'?'#c8d8e0':'#d48755';
   c.fillRect(198,92,44,10);

   // Medallion disc with gentle bob
   const my=142+Math.sin(t*2.4)*3.5;
   const outerColor=tier==='gold'?'#e5a922':tier==='silver'?'#9fb3bf':'#b56738';
   const innerColor=tier==='gold'?'#ffd866':tier==='silver'?'#e3eef5':'#e69d6c';
   const rimHighlight=tier==='gold'?'#fff3b8':tier==='silver'?'#ffffff':'#ffd4b3';

   // Scalloped outer rosette for Gold
   if(tier==='gold'){
    drawStar(220,my,16,58,51,'#c98c12',t*0.2);
   }
   oval(c,220,my,52,52,outerColor);
   oval(c,220,my,43,43,innerColor);
   c.strokeStyle=rimHighlight;
   c.lineWidth=2.2;
   c.beginPath();
   c.arc(220,my,43,0,Math.PI*2);
   c.stroke();

   // Central star & medical cross emblem on medal
   drawStar(220,my,5,24,11,outerColor,Math.sin(t)*0.1);
   drawStar(220,my,5,19,8.5,rimHighlight,Math.sin(t)*0.1);

   // Shimmering sparkles
   const spCount=tier==='gold'?14:8;
   for(let s=0;s<spCount;s++){
    const sa=s*2.1+t*0.6;
    const sr=62+(s%4)*22;
    const sx=220+Math.cos(sa)*sr*1.2;
    const sy=my+Math.sin(sa)*sr*0.75;
    const pulse=Math.max(0,Math.sin(t*4+s*1.3))*4.5;
    if(pulse>0.5)drawStar(sx,sy,4,pulse,pulse*0.35,rimHighlight);
   }
  }else if(tier==='warn'){
   // Amber probation bridge scene
   const pulse=0.5+0.5*Math.sin(t*6);
   const bg=c.createLinearGradient(0,0,0,260);
   bg.addColorStop(0,'#2b1d12');
   bg.addColorStop(1,'#171c21');
   c.fillStyle=bg;
   c.fillRect(0,0,440,260);

   // Hazard stripes at top & bottom
   c.fillStyle='#f0983e33';
   for(let x=-20;x<460;x+=28){
    c.beginPath();
    c.moveTo(x,0);c.lineTo(x+14,0);c.lineTo(x+4,12);c.lineTo(x-10,12);c.closePath();c.fill();
    c.beginPath();
    c.moveTo(x,248);c.lineTo(x+14,248);c.lineTo(x+4,260);c.lineTo(x-10,260);c.closePath();c.fill();
   }

   // Flashing amber beacon lights
   oval(c,55,42,16+pulse*6,16+pulse*6,`rgba(245,166,35,${0.25+pulse*0.35})`);
   oval(c,385,42,16+pulse*6,16+pulse*6,`rgba(245,166,35,${0.25+pulse*0.35})`);
   oval(c,55,42,7,7,'#ffc86b');
   oval(c,385,42,7,7,'#ffc86b');

   // Stern Captain portrait on bridge monitor
   c.fillStyle='#1f2c33';
   c.strokeStyle='#f0983e';
   c.lineWidth=2.5;
   c.beginPath();
   c.roundRect(136,26,168,128,12);
   c.fill();
   c.stroke();
   c.imageSmoothingEnabled=false;
   c.drawImage(offCapt,150,36,140,100);

   // Warning stamp banner
   c.save();
   c.translate(220,198);
   c.rotate(-0.04);
   c.fillStyle='#3b2210f0';
   c.strokeStyle='#ffb347';
   c.lineWidth=2.5;
   c.beginPath();
   c.roundRect(-142,-24,284,48,8);
   c.fill();
   c.stroke();
   c.fillStyle='#ffd285';
   c.font='bold 16px ui-monospace,monospace';
   c.textAlign='center';
   c.fillText('⚠ CAPTAIN’S WARNING ISSUED',0,-2);
   c.font='bold 11px ui-monospace,monospace';
   c.fillStyle='#f5b873';
   c.fillText('PROBATIONARY STATUS · REVIEW CODEX',0,15);
   c.restore();
  }else{
   // 0/10 FIRED emergency scene
   const alarm=0.5+0.5*Math.sin(t*9);
   const bg=c.createLinearGradient(0,0,0,260);
   bg.addColorStop(0,`rgb(${52+Math.round(alarm*35)},16,24)`);
   bg.addColorStop(1,'#181016');
   c.fillStyle=bg;
   c.fillRect(0,0,440,260);

   // Red emergency klaxons
   oval(c,52,40,20+alarm*8,20+alarm*8,`rgba(235,90,104,${0.3+alarm*0.4})`);
   oval(c,388,40,20+alarm*8,20+alarm*8,`rgba(235,90,104,${0.3+alarm*0.4})`);
   oval(c,52,40,8,8,'#ff6b7b');
   oval(c,388,40,8,8,'#ff6b7b');

   // Captain shaking head in disappointment
   const shake=Math.sin(t*10)*4;
   c.fillStyle='#261419';
   c.strokeStyle='#eb5a68';
   c.lineWidth=2.5;
   c.beginPath();
   c.roundRect(136,24,168,126,12);
   c.fill();
   c.stroke();
   c.imageSmoothingEnabled=false;
   c.drawImage(offCapt,150+shake,34,140,100);

   // Stamped "FIRED / RELIEVED OF COMMAND" notice
   const slam=Math.min(1,t/0.35);
   const scale=1+(1-slam)*0.6;
   c.save();
   c.translate(220,196);
   c.scale(scale,scale);
   c.rotate(-0.07);
   c.fillStyle='#4a121cf2';
   c.strokeStyle='#ff6b7b';
   c.lineWidth=3;
   c.beginPath();
   c.roundRect(-148,-26,296,52,8);
   c.fill();
   c.stroke();
   c.fillStyle='#ff9da8';
   c.font='bold 18px ui-monospace,monospace';
   c.textAlign='center';
   c.fillText('✖ RELIEVED OF COMMAND — FIRED',0,-2);
   c.font='bold 11px ui-monospace,monospace';
   c.fillStyle='#ffc2c9';
   c.fillText('0 FIRST-TRY DISPATCHES · BADGE REVOKED',0,16);
   c.restore();
  }

  if(!minimal)frame=requestAnimationFrame(draw);
 }
 draw(start);
}

const shiftSize=10;
let cases=[];
let missedHistory=[];
const sceneForCell=[0,2,1,3,4,5,6];

function cloneCase(m){
 return m[5]?[m[0],m[1],m[2],m[3],m[4],m[5].map(s=>s.slice())]:m.slice();
}

function shuffle(items){
 const result=items.slice();
 for(let end=result.length-1;end>0;end--){
  const pick=Math.floor(Math.random()*(end+1));
  [result[end],result[pick]]=[result[pick],result[end]];
 }
 return result;
}

function drawShift(previous,mode='standard'){
 if(mode==='missed'&&missedHistory.length){
  return missedHistory.map(cloneCase);
 }
 if(mode==='cascade'){
  return shuffle(cascadeBank).map(cloneCase);
 }
 const missedTitles=new Set(missedHistory.map(m=>m[0]));
 const prevTitles=new Set(previous.map(m=>m[0]));
 const available=caseBank.filter(mission=>!prevTitles.has(mission[0])||missedTitles.has(mission[0]));
 const pools=cells.map((cellItem,id)=>{
  const cellPool=available.filter(mission=>mission[2]===id);
  return shuffle(cellPool.length?cellPool:caseBank.filter(mission=>mission[2]===id));
 });
 const chosen=pools.map(pool=>pool.pop());
 const bonusPools=shuffle(pools).slice(0,shiftSize-1-chosen.length);
 const nine=shuffle(chosen.concat(bonusPools.map(pool=>pool.pop()))).map(cloneCase);
 const boss=cloneCase(shuffle(cascadeBank)[0]);
 return nine.concat([boss]);
}

let index=0,stageIndex=0,score=0,tried=new Set(),done=false,activeSelect=null,activeDeliver=null;
const misses=new Set();

function startShift(mode='standard'){
 cases=drawShift(cases,mode);
 index=0;
 stageIndex=0;
 score=0;
 tried.clear();
 misses.clear();
 done=false;
 show();
}

function bridge(){
 stopScene();
 activeSelect=null;
 activeDeliver=null;
 game.innerHTML='<section class="bridge"><div class="portrait"><canvas id="capt" width="140" height="100" aria-label="Pixel-art dispatch captain"></canvas><small>Command deck · Main menu</small></div><div class="orders"><small>Incoming transmission</small><h2>Captain, take the helm.</h2><p>Your shift has nine standard dispatches plus a final 3-stage physiological cascade drawn from a bank of 31 calls. Earn <b>10/10 for Gold</b>, <b>8+/10 for Silver</b>, or <b>6+/10 for Bronze</b>—score under 6 for a Captain’s Warning, or 0/10 and you’re fired!</p><div class="btn-row"><button class="next" id="launch" type="button">Accept command (10-case shift) ▸</button><button class="next secondary" id="launchCascade" type="button">Cascade drill (3 multi-stage calls)</button>'+(missedHistory.length?'<button class="next secondary" id="bridgeRetry" type="button">Retry last missed ('+missedHistory.length+')</button>':'')+'</div></div></section>';
 captain(document.getElementById('capt'),'normal');
 document.getElementById('launch').onclick=()=>startShift('standard');
 document.getElementById('launchCascade').onclick=()=>startShift('cascade');
 const brRetry=document.getElementById('bridgeRetry');
 if(brRetry)brRetry.onclick=()=>startShift('missed');
}

function currentMissionData(){
 const mission=cases[index];
 if(mission[5]){
  const st=mission[5][stageIndex];
  return {title:mission[0],brief:st[0],target:st[1],hint:st[2],label:st[3],isCascade:true,totalStages:mission[5].length};
 }
 return {title:mission[0],brief:mission[1],target:mission[2],hint:mission[3],label:mission[4],isCascade:false,totalStages:1};
}

function unitDisplayName(id,revealed=false){
 if(!blindMode||revealed||tried.has(id))return cells[id][0];
 return 'Specimen #'+(id+1);
}

function refreshCrewLabels(){
 game.querySelectorAll('.choice').forEach(btn=>{
  const id=Number(btn.dataset.unit);
  const labelSpan=btn.querySelector('.unit-name');
  if(!labelSpan)return;
  const revealed=!blindMode||done||tried.has(id);
  labelSpan.textContent=unitDisplayName(id,revealed);
  labelSpan.classList.toggle('blind-label',!revealed);
  btn.setAttribute('aria-label',revealed?cells[id][0]:'Specimen '+(id+1)+': '+cells[id][4]);
 });
}

function show(){
 busy=false;
 const {title,brief,target,label,isCascade,totalStages}=currentMissionData();
 game.innerHTML='<div class="case"><div class="brief"><div class="toolbar" style="margin-bottom:6px"><div class="eyebrow">Mission '+(index+1)+' / '+cases.length+'</div><button type="button" id="abortMenu" class="pill-toggle" title="Exit current shift and return to the Command Deck main menu">← Main menu</button></div>'+(isCascade?'<div class="stage-track">⚡ Multi-stage cascade · Stage '+(stageIndex+1)+' of '+totalStages+'</div>':'')+'<h2>'+title+'</h2><p>'+brief+'</p></div><button type="button" class="scope landing" id="landing" aria-label="Dispatch selected component to '+label+'"><canvas id="field" width="500" height="270" aria-hidden="true"></canvas><small id="caption"></small><span id="dropLabel">Drop crew here ↓</span></button></div><div class="line"><h3>Crew board</h3><span class="score">First-try score <b id="points">'+score+'</b> / '+cases.length+'</span></div><p class="instruction">Drag a component into the scene, tap it and tap the scene, or press keys <b>1–7</b> then <b>Enter</b>.</p><div class="crew"></div><div id="feedback" aria-live="polite"></div>';
 document.getElementById('abortMenu').onclick=()=>bridge();
 const captionEl=document.getElementById('caption');
 const fieldEl=document.getElementById('field');
 const dropLabelEl=document.getElementById('dropLabel');
 const zone=document.getElementById('landing');
 captionEl.textContent=label;
 paintScene(fieldEl,sceneForCell[target]);
 let selected=null;
 function select(btn){
  game.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  selected=btn;
  if(btn){
   const uid=Number(btn.dataset.unit);
   dropLabelEl.textContent='Send '+unitDisplayName(uid)+' here ↵';
   sfx('select');
  }else{
   dropLabelEl.textContent='Drop crew here ↓';
  }
 }
 function deliver(btn){
  if(!btn||btn.disabled||busy||done)return;
  select(null);
  choose(Number(btn.dataset.unit),btn);
 }
 activeSelect=id=>{
  const btn=game.querySelector('.choice[data-unit="'+id+'"]');
  if(btn&&!btn.disabled&&!busy&&!done){
   select(selected===btn?null:btn);
   btn.focus();
  }
 };
 activeDeliver=()=>{
  if(selected&&!busy&&!done){
   deliver(selected);
   return true;
  }
  return false;
 };
 zone.onclick=()=>{
  if(selected)deliver(selected);
  else if(!busy&&!done)game.querySelector('.choice:not(:disabled)')?.focus();
 };
 cells.forEach(([name],id)=>{
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='choice';
  btn.dataset.unit=id;
  btn.setAttribute('aria-pressed','false');
  btn.innerHTML='<span class="key-hint">'+(id+1)+'</span><canvas aria-hidden="true" width="96" height="96"></canvas><span class="unit-name"></span>';
  cell(btn.querySelector('canvas').getContext('2d'),id,48,48,35,-.2);
  game.querySelector('.crew').append(btn);
  let origin=null,ghost=null,suppressClick=false;
  btn.onclick=()=>{if(!suppressClick)select(selected===btn?null:btn)};
  btn.onpointerdown=e=>{
   if(!e.isPrimary||e.button!==0||btn.disabled||busy||done)return;
   origin={x:e.clientX,y:e.clientY};
   suppressClick=false;
   btn.setPointerCapture(e.pointerId);
  };
  function overScene(e){
   const r=zone.getBoundingClientRect();
   return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  }
  btn.onpointermove=e=>{
   if(!origin||!e.isPrimary)return;
   if(!ghost&&Math.hypot(e.clientX-origin.x,e.clientY-origin.y)<5)return;
   if(!ghost){
    clearGhost();
    ghost=document.createElement('canvas');
    ghost.width=ghost.height=96;
    ghost.className='dragged';
    ghost.setAttribute('aria-hidden','true');
    cell(ghost.getContext('2d'),id,48,48,36,-.2);
    document.body.append(ghost);
    select(btn);
   }
   ghost.style.left=e.clientX+'px';
   ghost.style.top=e.clientY+'px';
   zone.classList.toggle('over',overScene(e));
  };
  function end(e,accept){
   if(!origin||!e.isPrimary)return;
   origin=null;
   if(!ghost)return;
   suppressClick=true;
   ghost.remove();
   ghost=null;
   zone.classList.remove('over');
   if(accept&&overScene(e))deliver(btn);else select(null);
   setTimeout(()=>{suppressClick=false},0);
  }
  btn.onpointerup=e=>end(e,true);
  btn.onpointercancel=btn.onlostpointercapture=e=>end(e,false);
 });
 refreshCrewLabels();
}

function choose(id,btn){
 if(done||busy||tried.has(id))return;
 busy=true;
 tried.add(id);
 sfx('dispatch');
 const {target,hint,isCascade,totalStages}=currentMissionData();
 const right=id===target;
 const fieldEl=document.getElementById('field');
 const captionEl=document.getElementById('caption');
 const feedbackEl=document.getElementById('feedback');
 const pointsEl=document.getElementById('points');
 paintScene(fieldEl,sceneForCell[target],id,right);
 game.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 refreshCrewLabels();
 captionEl.textContent='Dispatching '+cells[id][0]+'…';
 feedbackEl.innerHTML='<div class="feed">Crew en route…</div>';
 timer=setTimeout(()=>{
  busy=false;
  if(right){
   sfx('win');
   const finalStage=!isCascade||stageIndex===totalStages-1;
   if(finalStage){
    done=true;
    if(!misses.has(index)&&tried.size===1){
     score++;
     pointsEl.textContent=score;
    }
   }
   btn.classList.add('correct');
   refreshCrewLabels();
  }else{
   sfx('loss');
   misses.add(index);
   [...game.querySelectorAll('.choice')].forEach(b=>{
    b.disabled=tried.has(Number(b.dataset.unit));
   });
   refreshCrewLabels();
  }
  captionEl.textContent=right?outcomes[sceneForCell[target]][0]:'Backup requested';
  feedbackEl.innerHTML='<div class="feed '+(right?'win':'loss')+'"><small>'+(right?(isCascade&&stageIndex<totalStages-1?'✦ Stage '+(stageIndex+1)+' complete':'✦ Mission complete'):'⚠ Dispatch missed')+'</small><h3>'+(right?outcomes[sceneForCell[target]][0]+' ('+cells[id][0]+')':'Backup requested — '+cells[id][0]+' sent')+'</h3><p>'+(right?outcomes[sceneForCell[target]][1]:outcomes[sceneForCell[target]][2]+' '+cells[id][1]+' '+hint)+'</p><span class="refs">Reed, slide '+cells[id][2]+' · Marieb &amp; Keller, § '+(id===0?'10.2a':'10.1d')+'</span></div>';
  if(right){
   const b=document.createElement('button');
   b.type='button';
   b.className='next';
   const moreStages=isCascade&&stageIndex<totalStages-1;
   b.textContent=moreStages?'Next stage ('+(stageIndex+2)+'/'+totalStages+') →':index===cases.length-1?'See shift evaluation →':'Next case →';
   feedbackEl.append(b);
   b.onclick=()=>{
    if(moreStages){
     stageIndex++;
     tried.clear();
     done=false;
     show();
     game.querySelector('.choice')?.focus();
    }else if(index===cases.length-1){
     finish();
    }else{
     index++;
     stageIndex=0;
     tried.clear();
     done=false;
     show();
     game.querySelector('.choice')?.focus();
    }
   };
   b.focus();
  }else{
   game.querySelector('.choice:not(:disabled)')?.focus();
  }
 },minimal?0:1550);
}

function finish(){
 stopScene();
 activeSelect=null;
 activeDeliver=null;
 missedHistory=[...misses].map(i=>cloneCase(cases[i]));
 const outcome=evaluateShiftTier(score,cases.length);
 sfx(outcome.tier);

 const revisitHtml=misses.size
  ?'<div class="revisit-panel"><h3>Cases to revisit ('+misses.size+')</h3><ul class="revisit-list">'+[...misses].map(i=>{
    const m=cases[i];
    if(m[5]){
     const chain=m[5].map(st=>cells[st[1]][0]).join(' → ');
     return '<li class="revisit-item"><b>'+m[0]+'</b> — Required sequence: <b>'+chain+'</b><span class="refs">Multi-stage hemostasis, innate defense, and tissue resolution cascade</span></li>';
    }
    const cid=m[2];
    return '<li class="revisit-item"><b>'+m[0]+'</b> — Dispatch <b>'+cells[cid][0]+'</b>: '+cells[cid][1]+'<span class="refs">Morphology cue: '+cells[cid][4]+' · Reed, slide '+cells[cid][2]+' · Marieb &amp; Keller, § '+(cid===0?'10.2a':'10.1d')+'</span></li>';
   }).join('')+'</ul></div>'
  :'';

 game.innerHTML='<div class="case finish-card"><div class="brief"><div class="eyebrow">Shift evaluation · '+score+' of '+cases.length+' on the first try</div><h2>'+outcome.headline+'</h2><div class="boss-quote '+outcome.quoteClass+'">'+outcome.quote+'</div><p>Reward tiers: <b>10/10 Gold</b> · <b>8/10 Silver</b> · <b>6/10 Bronze</b> · <b>&lt;6 Warning</b> · <b>0/10 Fired</b></p><div class="btn-row"><button class="next" id="again" type="button">New 10-case shift ▸</button>'+(missedHistory.length?'<button class="next secondary" id="retryMisses" type="button">Retry missed cases ('+missedHistory.length+')</button>':'')+'<button class="next secondary" id="playCascades" type="button">Cascade drill (3)</button><button class="next ghost-btn" id="mainMenuBtn" type="button">← Back to main menu</button></div></div><div class="reward-stage"><canvas id="rewardCanvas" width="440" height="260" aria-label="'+outcome.headline+'"></canvas><span class="reward-rank '+outcome.badgeClass+'">'+outcome.badge+'</span></div></div>'+revisitHtml;

 paintRewardScene(document.getElementById('rewardCanvas'),outcome.tier);

 const againBtn=document.getElementById('again');
 againBtn.onclick=()=>startShift('standard');
 const retryBtn=document.getElementById('retryMisses');
 if(retryBtn)retryBtn.onclick=()=>startShift('missed');
 document.getElementById('playCascades').onclick=()=>startShift('cascade');
 document.getElementById('mainMenuBtn').onclick=()=>bridge();
 againBtn.focus();
}

function modal(html){
 clearGhost();
 detail.innerHTML=html;
 info.showModal();
}

 modal('<h2>Crew Codex &amp; Differential WBC Count</h2><div class="mnemonic-box"><b>WBC Abundance Mnemonic — "Never Let Monkeys Eat Bananas":</b><br>Neutrophils (50–70%) → Lymphocytes (25–45%) → Monocytes (3–8%) → Eosinophils (2–4%) → Basophils (&lt;1%)</div><div class="codex-grid" id="codexGrid"></div>');

window.addEventListener('keydown',e=>{
 if(info.open||e.altKey||e.ctrlKey||e.metaKey)return;
